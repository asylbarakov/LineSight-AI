# Portable defaults. See DOCKER_OPERATIONS.md; local overrides stay outside Git.
# Порты открыты только на 127.0.0.1; Postgres наружу не публикуется.
x-database-environment: &database-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-linesight}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-linesight}
  # Ignore stale duplicate URLs from older .env files inside Compose.
  DATABASE_URL: ""
  DATA_DIR: /data
  ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
  SECRET_KEY: ${SECRET_KEY:?Set a persistent SECRET_KEY in .env}
  TOKEN_TTL_HOURS: ${TOKEN_TTL_HOURS:-12}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
  POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-1.0}
  TASK_SOFT_TIME_LIMIT_SEC: ${TASK_SOFT_TIME_LIMIT_SEC:-900}
  FRAME_STEP_SEC: ${FRAME_STEP_SEC:-0.5}
  DETECT_CONF: ${DETECT_CONF:-0.25}
  DETECTOR: ${DETECTOR:-none}
  MODEL_PATH: ${MODEL_PATH:-/data/weights/best.pt}
  SHARPNESS_MIN: ${SHARPNESS_MIN:-60.0}
  BRIGHTNESS_MIN: ${BRIGHTNESS_MIN:-50.0}
  LOW_VIS_MIN_SEC: ${LOW_VIS_MIN_SEC:-2.0}
  REPORT_TZ: ${REPORT_TZ:-UTC}
  REPORT_FONT: ${REPORT_FONT:-}
  DEMO_DIR: ${DEMO_DIR:-/data/demo}
  DEMO_KEEP: ${DEMO_KEEP:-0}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linesight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-linesight}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h postgres -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -XAtqc 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_YOLO: "0"
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/data
      - ./data/demo:/data/demo
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_YOLO: ${INSTALL_YOLO:-0}
    command: ["python", "-m", "app.worker"]
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/data
      - ./data/weights:/data/weights:ro
    # GPU: раскомментируйте на машине с NVIDIA Container Toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import app.db\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: frontend
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3004}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  media_data:
