# Portable defaults. See DOCKER_OPERATIONS.md; local overrides stay outside Git.
# Порты открыты только на 127.0.0.1; Postgres наружу не публикуется.
name: linesight-ai-frontend-ui

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linesight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-linesight}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linesight} -d ${POSTGRES_DB:-linesight}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: linesight-ai-frontend-ui-api:current
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_YOLO: "0"
    env_file: .env
    environment:
      DATA_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/data
      - ./data/demo:/data/demo
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    image: linesight-ai-frontend-ui-worker:current
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_YOLO: ${INSTALL_YOLO:-0}
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATA_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/data
      - ./data/weights:/data/weights:ro
    # GPU: раскомментируйте на машине с NVIDIA Container Toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import app.db\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    image: linesight-ai-frontend-ui-web:current
    build:
      context: frontend
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3004}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  media_data:
